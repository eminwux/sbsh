apiVersion: v1beta1
kind: Team
metadata: { name: sbsh }
spec:
  # The project is this repository: the Source named like the team, sbsh.
  projectSource: { url: github.com/eminwux/sbsh, branch: main }
  sources:
    # agents is private, so it is fetched over SSH.
    - name: agents
      url: git@github.com:eminwux/agents
      branch: main
      clonePath: /home/user/agents
    - name: kukeon
      url: github.com/eminwux/kukeon
      branch: main
  roles:
    - { name: dev, source: agents, path: dev, needs: { image: [go] } }
    - { name: pm, source: agents, path: pm }
    - { name: pr-reviewer, source: agents, path: pr-reviewer }
  # Harness definitions, contexts and image catalogs live in the kukeon
  # repository (team/harnesses/).
  harnesses:
    - { name: claude, source: kukeon, path: team/harnesses/claude }
    - { name: codex, source: kukeon, path: team/harnesses/codex }
